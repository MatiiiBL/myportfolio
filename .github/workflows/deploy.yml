name: Deploy

on:
  push:
    branches: [Main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Check, build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Prettier, ESLint, TypeScript, Vitest and the production build, which prerenders every
      # route into dist/ (index.html, projects/<slug>/index.html, 404.html, sitemap.xml).
      - run: npm run check

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./dist
          if-no-files-found: error

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./dist

      # Pushes dist/ to the gh-pages branch, which GitHub Pages serves at
      # https://matiiibl.github.io/myportfolio/. It adds .nojekyll, so Pages serves the files
      # as they are. The action runs with write access, so it is pinned to a commit rather than
      # a tag, which its owner could move; this is the commit of release v4.1.0.
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: Deploy ${{ github.sha }}
